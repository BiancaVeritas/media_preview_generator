name: Build Chinese image

# Builds this fork's Chinese UI + STRM image and publishes it to GitHub
# Container Registry as ghcr.io/<owner>/<repo>:zh, which a compose file can
# pull directly. The base image provides FFmpeg and the Python dependencies,
# so only this repository's package is replaced (Dockerfile.zh).

on:
  push:
    branches: [zh-ui-strm, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zh-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zh
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:zh
            ${{ steps.image.outputs.name }}:zh-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
